name: Windows x64
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vst3:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC x64
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build VST3, standalone and tests
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item README.md build/RVOXX_artefacts/Release/VST3/README.md
          Compress-Archive -Path build/RVOXX_artefacts/Release/VST3/RVOXX.vst3,build/RVOXX_artefacts/Release/VST3/README.md -DestinationPath dist/RVOXX-Windows-x64.zip
          Compress-Archive -Path build/RVOXX_artefacts/Release/Standalone/RVOXX.exe -DestinationPath dist/RVOXX-Standalone-Windows-x64.zip
          Get-FileHash dist/*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RVOXX-Windows-x64
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: vst3
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RVOXX-Windows-x64
          path: dist
      - name: Publish downloadable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --prerelease --title "RVOXX $GITHUB_REF_NAME — Windows x64" --notes-file RELEASE_NOTES.md
